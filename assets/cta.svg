<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="50"/></filter>
    <clipPath id="clip"><rect width="1200" height="220" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="220" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.9">
      <circle cx="220" cy="110" r="110" fill="#2563eb"><animate attributeName="cx" values="220;420;220" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="960" cy="120" r="120" fill="#7c3aed"><animate attributeName="cx" values="960;760;960" dur="13s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="36" y="30" width="1128" height="160" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity="0.22"/>
    <text x="84" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Have a project in mind?</text>
    <text x="84" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#a8b5c9">Let's build something reliable, secure and fast.</text>
    <rect x="800" y="70" width="320" height="64" rx="32" fill="url(#btn)">
      <animate attributeName="opacity" values="1;0.85;1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="960" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">Get in touch  &#8594;</text>
  </g>
</svg>
