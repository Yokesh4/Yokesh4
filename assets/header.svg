<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#93c5fd"/><stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.9">
      <circle cx="200" cy="90" r="130" fill="#2563eb">
        <animate attributeName="cx" values="200;420;200" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="90;200;90" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="980" cy="250" r="150" fill="#7c3aed">
        <animate attributeName="cx" values="980;780;980" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="250;120;250" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="40" r="95" fill="#06b6d4">
        <animate attributeName="cx" values="640;900;640" dur="10s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- main glass panel -->
    <rect x="36" y="36" width="1128" height="268" rx="30" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.22"/>
    <rect x="36" y="36" width="1128" height="2" rx="1" fill="url(#edge)"/>

    <text x="84" y="132" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#name)" letter-spacing="-1">Maria Antony Yokesh V</text>
    <text x="86" y="176" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#cbd5e1">Software Developer  ·  Java  ·  Spring Boot  ·  Angular  ·  React</text>
    <text x="86" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">Enterprise-grade web applications, APIs and AI-powered features</text>

    <!-- status pill -->
    <rect x="84" y="232" width="330" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.25"/>
    <circle cx="110" cy="254" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="254" r="6" fill="none" stroke="#22c55e">
      <animate attributeName="r" values="6;16" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="130" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e2e8f0">Open to Freelance &amp; Full-time</text>

    <!-- floating cards -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="5s" repeatCount="indefinite"/>
      <rect x="800" y="66" width="310" height="62" rx="18" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="824" y="93" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">TeamForge ALM 26.0</text>
      <text x="824" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Digital.ai · Mar – Sept 2026</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="6s" repeatCount="indefinite"/>
      <rect x="860" y="146" width="250" height="62" rx="18" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="884" y="173" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">MCP Server Tools</text>
      <text x="884" y="194" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">AI actions for ALM artifacts</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="7s" repeatCount="indefinite"/>
      <rect x="800" y="226" width="310" height="62" rx="18" fill="#ffffff" fill-opacity="0.09" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="824" y="253" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">BoosterEdu v1.0.0 + Learnix AI</text>
      <text x="824" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Spring Boot · React · Groq API</text>
    </g>
  </g>
</svg>
