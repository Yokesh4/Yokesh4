<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050816"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="i1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="i2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <linearGradient id="i3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#0e7490"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <clipPath id="clip"><rect width="1200" height="450" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="450" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity="0.85">
      <circle cx="180" cy="120" r="120" fill="#2563eb"><animate attributeName="cx" values="180;360;180" dur="13s" repeatCount="indefinite"/></circle>
      <circle cx="1000" cy="330" r="140" fill="#7c3aed"><animate attributeName="cy" values="330;170;330" dur="12s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="230" r="100" fill="#06b6d4"><animate attributeName="cx" values="600;760;600" dur="15s" repeatCount="indefinite"/></circle>
    </g>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
      <!-- row 1 -->
      <rect x="30" y="25" width="360" height="190" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity="0.2"/>
      <rect x="56" y="51" width="52" height="52" rx="16" fill="url(#i1)"/><text x="82" y="85" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">&lt;/&gt;</text>
      <text x="56" y="138" font-size="20" font-weight="700" fill="#fff">Full-Stack Web Apps</text>
      <text x="56" y="164" font-size="14" fill="#a8b5c9">React / Angular frontends with Spring Boot</text>
      <text x="56" y="184" font-size="14" fill="#a8b5c9">backends, built for production.</text>

      <rect x="420" y="25" width="360" height="190" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity="0.2"/>
      <rect x="446" y="51" width="52" height="52" rx="16" fill="url(#i2)"/><text x="472" y="84" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">API</text>
      <text x="446" y="138" font-size="20" font-weight="700" fill="#fff">REST APIs &amp; Security</text>
      <text x="446" y="164" font-size="14" fill="#a8b5c9">JWT, refresh tokens, RBAC, rate limiting</text>
      <text x="446" y="184" font-size="14" fill="#a8b5c9">and PostgreSQL data modelling.</text>

      <rect x="810" y="25" width="360" height="190" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity="0.2"/>
      <rect x="836" y="51" width="52" height="52" rx="16" fill="url(#i3)"/><text x="862" y="84" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">AI</text>
      <text x="836" y="138" font-size="20" font-weight="700" fill="#fff">AI-Powered Features</text>
      <text x="836" y="164" font-size="14" fill="#a8b5c9">Groq LLM integrations, summaries, quiz</text>
      <text x="836" y="184" font-size="14" fill="#a8b5c9">generation and MCP server tools.</text>

      <!-- row 2 -->
      <rect x="30" y="235" width="360" height="190" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity="0.2"/>
      <rect x="56" y="261" width="52" height="52" rx="16" fill="url(#i2)"/><text x="82" y="294" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">CI</text>
      <text x="56" y="348" font-size="20" font-weight="700" fill="#fff">CI/CD &amp; Deployment</text>
      <text x="56" y="374" font-size="14" fill="#a8b5c9">GitLab pipelines, Docker, Render and</text>
      <text x="56" y="394" font-size="14" fill="#a8b5c9">Vercel releases with uptime monitoring.</text>

      <rect x="420" y="235" width="360" height="190" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity="0.2"/>
      <rect x="446" y="261" width="52" height="52" rx="16" fill="url(#i3)"/><text x="472" y="295" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">&#8635;</text>
      <text x="446" y="348" font-size="20" font-weight="700" fill="#fff">Legacy Modernization</text>
      <text x="446" y="374" font-size="14" fill="#a8b5c9">JSP to Angular migrations, shared services</text>
      <text x="446" y="394" font-size="14" fill="#a8b5c9">and consistent notification flows.</text>

      <rect x="810" y="235" width="360" height="190" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity="0.2"/>
      <rect x="836" y="261" width="52" height="52" rx="16" fill="url(#i1)"/><text x="862" y="294" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">&#10003;</text>
      <text x="836" y="348" font-size="20" font-weight="700" fill="#fff">Testing &amp; Quality</text>
      <text x="836" y="374" font-size="14" fill="#a8b5c9">Playwright end-to-end tests, reusable</text>
      <text x="836" y="394" font-size="14" fill="#a8b5c9">components and production defect fixes.</text>
    </g>
  </g>
</svg>
